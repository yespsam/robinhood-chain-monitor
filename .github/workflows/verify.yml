name: Verify repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Tests must never load a developer's real configuration or durable state.
      DOTENV_CONFIG_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Test
        env:
          DATA_DIR: ${{ runner.temp }}/yesp-test-data
        run: npm test -- --test-concurrency=2
      - name: Build allowlisted public assets
        run: npm run build:public
